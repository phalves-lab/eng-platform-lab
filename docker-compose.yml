services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - '5433:5432'
    volumes:
      - portal-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal-db:
