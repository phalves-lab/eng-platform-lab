name: e2e

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'apps/portal-api/**'
      - 'apps/portal-web/**'
      - 'apps/portal-worker/**'
      - 'apps/portal-e2e/**'
      - 'packages/**'
      - 'tools/eng-metrics/**'
      - 'handbook/**'
      - 'catalog/**'
      - 'fixtures/**'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://localhost:5432/lab
      PGUSER: postgres
      PGPASSWORD: lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/portal-e2e
      - name: Fluxos críticos e acessibilidade
        run: npm run e2e -w @lab/portal-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/portal-e2e/playwright-report
            apps/portal-e2e/test-results
          retention-days: 7
